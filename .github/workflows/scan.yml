name: Daily Qullamaggie Scan

on:
  schedule:
    - cron: "30 22 * * 1-5"   # pn-pt 22:30 UTC = po zamknieciu sesji US
  workflow_dispatch: {}        # + przycisk "Run workflow" do recznego odpalenia

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit results
        run: |
          git config user.name "qmag-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/results.json
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git push
